spring:
  application:
    name: onnuri-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onnuri}
    username: ${DB_USER:onnuri}
    password: ${DB_PASSWORD:onnuri}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 관리, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

# 프론트(정적 사이트) 교차 호출 허용 오리진. 배포 도메인 확정 시 조정.
app:
  cors:
    allowed-origins: >-
      http://localhost:8655,
      http://127.0.0.1:8655,
      https://canduk910.github.io,
      https://koscomlabor.cloud,
      https://onnuri.koscomlabor.cloud
  map:
    max-markers: 3000          # 지도 좌표 API 상한(현 클라이언트 MAP_MAX와 동일)
  admin:
    key: ${APP_ADMIN_KEY:}     # 제보 처리상태 변경 키 — 서버 .env에만 실제 값. 비면 관리 기능 비활성(403)
    password: ${APP_ADMIN_PASSWORD:}  # 관리자 로그인 비밀번호 — 서버 .env에만 실제 값. 비면 로그인 API 비활성(403)
    rate-per-minute: 5         # 로그인 무차별 대입 방지(IP당)
    rate-per-day: 30
  # 챗봇 (ADR-12). API 키는 서버 .env의 OPENAI_API_KEY로만 주입 — 코드·저장소 비노출.
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6-luna
    embed-model: text-embedding-3-small
  online:
    probe:                       # 온라인 실시간 조회 (ADR-17)
      enabled: ${APP_ONLINE_PROBE_ENABLED:true}   # 킬 스위치 — 끄면 전 항목 not-probed/disabled
      ttl-minutes: 60            # 같은 질의를 다시 밖으로 내보내지 않는 시간
      cache-size: 500
      timeout-ms: 4000           # 몰 1곳 요청 상한(connect 는 3s 고정)
      budget-ms: 8500            # 전체 예산 — 초과분은 unknown/timeout
                                 # (가장 느린 온누리공공몰 8초를 담는다. 나머지는 중앙값 0.6초)
      max-concurrent: 12         # 2 vCPU / 4 GB 방어
      max-bytes: 1000000         # 응답 본문 상한
      per-target-per-minute: 6   # 몰 단위(상대 사이트 부담)
      per-target-per-day: 600
      rate-per-minute: 5         # 이용자 IP 단위
      rate-per-day: 100
  chat:
    rate-per-minute: 10        # IP당 비용 통제(사용자 결정: rate limit만)
    rate-per-day: 200

server:
  port: 8080

# 헬스체크만 공개(그 외 actuator 엔드포인트는 비노출). DB 연결까지 확인.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: info
