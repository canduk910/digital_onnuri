spring:
  application:
    name: onnuri-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onnuri}
    username: ${DB_USER:onnuri}
    password: ${DB_PASSWORD:onnuri}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 관리, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

# 프론트(정적 사이트) 교차 호출 허용 오리진. 배포 도메인 확정 시 조정.
app:
  cors:
    allowed-origins: >-
      http://localhost:8655,
      http://127.0.0.1:8655,
      https://canduk910.github.io
  map:
    max-markers: 3000          # 지도 좌표 API 상한(현 클라이언트 MAP_MAX와 동일)
  # 챗봇 (ADR-12). API 키는 서버 .env의 OPENAI_API_KEY로만 주입 — 코드·저장소 비노출.
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6-luna
    embed-model: text-embedding-3-small
  chat:
    rate-per-minute: 10        # IP당 비용 통제(사용자 결정: rate limit만)
    rate-per-day: 200

server:
  port: 8080

# 헬스체크만 공개(그 외 actuator 엔드포인트는 비노출). DB 연결까지 확인.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: info
