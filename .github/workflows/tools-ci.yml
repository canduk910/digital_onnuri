# 배치·채록 도구 CI (2026-09-04 신설)
#
# `_workspace/dev_scripts` 의 검사들을 돌린다. **종 수도 건수도 여기 적지 않는다** —
# 적으면 낡고, 낡은 숫자는 다음 사람이 "이 목록이 전부"라고 믿게 만든다(2026-09-06:
# 검사를 하나 늘리며 이 줄이 5종에 멈춰 있던 것을 발견했다).
# 네트워크·DB·브라우저를 타지 않는다(전부 실측 확인 — robots 감시는 urlopen 을
# 가로채고, 색인 테스트는 playwright 를 지연 require 하는 코드만 부른다).
#
# ── 이것이 무엇을 막고 무엇을 못 막는지 (2026-09-05 갱신) ──────────────────
# **프론트 정적 계약은 여기서 빠졌다** — pages.yml 의 배포 게이트로 옮겼다.
# 검사 정의를 두 벌로 두면 사본이 갈라지므로 한 곳에만 둔다.
#
# **2026-09-05(C3): 더 이상 사후 알림이 아니다.** 세 레인 모두 이 잡의 결과에 걸린다:
#   · backend-ci 의 deploy 잡에 `contracts`(프론트 정적·D-F1·재빌드 비교)를 needs 로 걸었다
#   · pages.yml 의 deploy 는 `checks`(정적) + `browser`(렌더·스모크)를 needs 로 건다
#   · **야간 배치**는 `git pull` 앞에서 원격 HEAD 의 check-runs 를 조회해,
#     **실패로 끝난 검사가 하나라도 있으면 당기지 않는다**(DEPLOY.md '야간 배치' 절).
#     판정 방향은 "모르면 막지 않는다" — 확실한 실패만 막는다.
#
# 이 잡 자체는 다른 잡을 막지 않는다(needs 로 걸리는 쪽이 아니다). 배치가 **이 잡의 결과를
# 보러 오는** 구조다 — 그래서 여기가 빨개지면 그날 밤 배치는 옛 코드로 돈다.
# 그래도 값이 있는 이유는, 이 검사들이 지키는 것이
# "고장 나면 요란한 것"이 아니라 **조용히 어긋나는 것**이기 때문이다 —
# 채록 규칙 사본을 안 내보내면 "채록은 로봇청소기를 가전으로 보는데 화면은 못 찾는"
# 상태가 되고(2026-09-02), 소분류 id 오타 하나가 6개 몰의 칩을 날린다(meat-chicken,
# 2026-08-23). 둘 다 에러를 내지 않고 며칠 뒤 사람이 우연히 발견했다.
#
# 반대로 **이 테스트들이 잡지 못하는 것**도 분명하다. ADR-21 때 배치 파일에 헬퍼 블록이
# 통째로 두 벌 들어가 단계 E 가 죽었는데, 함수는 각각 멀쩡해 순수 테스트는 전부 통과했다.
# 실행해 보고서야 드러난 유형이라 이 CI 로는 못 막는다 — DEPLOY.md 의 5경로 실행 주의가
# 그 자리를 맡는다.
#
# ── backend-ci 에 합치지 않은 이유 ────────────────────────────────────────
# ①`_workspace/dev_scripts/**` 를 backend-ci 트리거에 넣으면 테스트 스크립트 한 줄만
#   고쳐도 NCP 프로덕션 배포가 나간다. 반대로 새 잡을 deploy 의 needs 에서 빼면
#   "도구 테스트는 빨간데 배포는 초록"이 된다. 둘 다 나쁘다.
#   (다만 `backend/tools/**`·`data/**` 는 `backend/**`·`data/**` 에 이미 걸려
#    오늘도 배포를 유발한다 — 새로 생기는 커플링은 dev_scripts 쪽뿐이다.)
# ②툴체인이 다르다. backend-ci 는 JDK 21/gradle 뿐이고 이쪽은 node+python 이다.
name: tools-ci

on:
  push:
    branches: [main]
    paths:
      - "_workspace/dev_scripts/**"        # survey_probe.js·dump_*.js·테스트 스크립트
      - "backend/tools/**"                 # nightly_update.py·index_nightly.js·survey_nightly.js
      # 검사들이 실제로 읽는 데이터만 적는다(파일 참조를 전수 확인해 역산).
      # `data/**` 로 두면 야간 배치가 매일 다시 쓰는 data/merchants/*.json 에도 걸리고,
      # 이 테스트들이 읽지도 않는 offline_categories.json 변경에 초록이 떠 '검사됐다'는
      # 잘못된 신호가 된다.
      - "data/online_platforms.json"
      - "data/online_catalog.json"
      - "data/cat_rules.json"
      - "data/brand_aliases.json"
      # D-F1(verify_build.py)이 읽는다. `*.html` 이 이미 있어 '데이터를 고치고 재빌드까지 한'
      # 커밋은 어차피 걸리지만, **데이터만 고치고 재빌드를 잊은** 커밋은 이 줄이 없으면
      # 안 걸린다 — 그것이 정확히 D-F1 이 잡으라고 있는 시나리오다.
      - "data/offline_categories.json"
      # 프론트 정적 계약 테스트가 지키는 것 — 페이지·공용 자산·설정
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/tools-ci.yml"
  workflow_dispatch: {}

# 배포도 시크릿도 필요 없다 — 읽기만.
permissions:
  contents: read

concurrency:
  group: tools-ci-${{ github.ref }}
  # backend-ci 는 false 다(배포 중단 방지). 여기는 배포가 없어 옛 회차를 취소해도 안전하다.
  cancel-in-progress: true

jobs:
  tools-test:
    name: 배치·채록·빌드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 한 잡에 두 런타임을 둔다 — test_robots_watch.py 가 node 를 subprocess 로 부르므로
      # (`node backend/tools/index_nightly.js --print-hosts`) 파이썬만으로는 못 돈다.
      # 잡을 쪼개면 setup 이 두 번 붙는데 테스트 합계는 1초 미만이라 setup 이 전부다.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"    # 서버 배치는 /opt/node20 을 쓴다(DEPLOY.md).
          # cache 를 켜지 마라 — 저장소에 package.json·lock 파일이 없어 액션이 실패한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # 서버(Ubuntu 22.04) 추정값. SSH 로 확인한 것은 아니다.
                                   # 로컬 3.9.6·3.13.5 양쪽에서 통과를 확인했으므로 폭이 넓다.

      - name: psycopg 설치
        # nightly_update.py 가 모듈 최상단에서 import 하고 없으면 sys.exit 한다.
        # **DB 에 붙지는 않는다** — import 만 통과하면 된다.
        # 저장소에 requirements.txt 가 없어 여기서 고정한다. 안 고정하면 저장소를
        # 아무도 안 건드린 날 상위 메이저가 나와 CI 가 깨진다.
        run: pip install 'psycopg[binary]==3.3.4'

      # 네 개를 별도 step 으로 두고 뒤 셋에 `!cancelled()` 를 건다 —
      # 앞이 실패해도 나머지가 돌아 **한 회차에 모든 실패가 보인다**.
      # 합계가 1초 미만이라 fail-fast 로 아낄 것이 없다.
      - name: 채록 프로브
        run: node _workspace/dev_scripts/test_survey_probe.js
      - name: 색인 크롤러
        if: '!cancelled()'
        run: node _workspace/dev_scripts/test_index_nightly.js
      - name: robots 감시
        if: '!cancelled()'
        run: python3 _workspace/dev_scripts/test_robots_watch.py
      - name: 카나리아 추세
        if: '!cancelled()'
        run: python3 _workspace/dev_scripts/test_canary_trend.py
      # 채록 반영 도구와 주간 다이제스트. 둘 다 경계에서만 드러나는 코드다 —
      # 반영 도구는 데이터 파일을 덮어쓰는데 판단이 틀려도 JSON 은 멀쩡히 파싱되고,
      # 다이제스트는 발화 조건이 틀리면 일주일이 지나야 알 수 있으며 에러가 안 난다.
      - name: 채록 반영 도구
        if: '!cancelled()'
        run: node _workspace/dev_scripts/test_apply_delta.js
      # 렌더 층(test_frontend_render.js)은 playwright 설치가 필요해 여기 없다 —
      # 그 설치가 40~70초라 1초짜리 잡의 성격이 통째로 바뀐다.
      #
      # 2026-09-05 정정: 종전 주석은 "pages.yml 이 조건 없이 배포하므로 어차피 게이트가
      # 아니다"를 근거로 들었는데, **그날 pages.yml 에 게이트가 붙어 그 전제가 깨졌다.**
      # 렌더 층을 어디에 둘지는 다시 열린 질문이다(23_backlog C3) — 지도 절은 원격에서
      # 어차피 스킵되므로 '지도 제외 렌더 + 스모크'만 게이트에 넣는 절충이 가능하다.
      # ── D-F1: index.html 이 build_index.py 산출물인지 (2026-09-05 편입) ──
      # 종전에는 못 돌았다 — verify_build.py 도 build_index.py 도 `index.html.bak-20260806`
      # (원본 번들)을 읽는데 그 파일이 gitignore 되어 있었다. 원본을 저장소에 넣어 해소했다.
      - name: index 빌드 검증 D-F1
        if: '!cancelled()'
        run: python3 _workspace/dev_scripts/verify_build.py
      # **토큰 검사만으로는 부족하다.** 그것은 "목록에 적어 둔 토큰이 있나 없나"를 볼 뿐이라,
      # 아무도 적지 않은 자리에서 소스와 산출물이 갈리면 조용히 통과한다(조사 실측: 빌더 문구
      # 수정 후 재빌드 누락 · 데이터 내용 변경 둘 다 D-F1 을 통과했고 재빌드 비교만 잡았다).
      # 그래서 실제로 다시 만들어 보고 **바이트가 같은지** 본다.
      - name: index 재빌드 후 커밋본과 동일한지
        if: '!cancelled()'
        run: |
          python3 _workspace/dev_scripts/build_index.py
          git diff --exit-code -- index.html \
            || { echo "::error::index.html 이 build_index.py 산출물과 다릅니다 — 소스를 고치고 재빌드를 잊었는지 확인하세요"; exit 1; }

# 여전히 넣지 않은 것: 프론트 **렌더** 테스트(test_frontend_render.js).
#   playwright 설치가 40~70초라 1초짜리 잡의 성격이 바뀌고, 지도 절은 로컬 전용이다
#   (원격 base 에서는 마커 클릭이 네이버 SDK 오버레이에 막힌다). 사람이 커밋 전에 부른다.
